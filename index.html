<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QR Manager" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="pwa/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="pwa/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="pwa/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="pwa/icon-192.png" />

    <title>Quản lý mã QR</title>
    <link rel="stylesheet" href="css/style.css" />
      <!-- ===== CSS CHỈNH SỬA QR (THÊM MỚI) ===== -->
    <link rel="stylesheet" href="css/edit-style.css" />
    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- ===== CROPPER.JS ===== -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <!-- ===== FIREBASE CONFIG ===== -->
    <script src="database/firebase-config.js"></script>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>✨ Quản lý mã QR</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-manage" id="btnInstallPwa" type="button" style="display:none;" title="Cài đặt app">Cài app</button>
                    <div id="authSection">
                        <button class="btn-manage" id="manageBtn">Đăng nhập</button>
                    </div>
                    <div id="userSection" style="display:none;">
                        <span class="user-name" id="usernameDisplay"></span>
                        <button class="btn-logout" id="logoutBtn">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container">
        <!-- ===== LOADING ===== -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Đang tải dữ liệu...</p>
            </div>
        </div>
        <!-- ===== SEARCH ===== -->
        <div class="search-section">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Tìm theo tên..." />
            </div>
        </div>

        <!-- ===== UPLOAD BUTTON ===== -->
        <div class="upload-area" id="uploadArea" style="display:none;">
            <button class="btn-upload" id="uploadBtn">Thêm mã QR mới</button>
        </div>

        <!-- ===== DANH SÁCH NGƯỜI DÙNG ===== -->
        <section class="user-list" id="userList"></section>

        <!-- ===== EMPTY STATE ===== -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <span>📭</span>
            <p>Chưa có mã QR nào. Hãy đăng nhập để thêm mới!</p>
        </div>

    </main>

    <!-- ===== MODAL CHI TIẾT ===== -->
    <div class="modal" id="detailModal">
        <div class="modal-content detail-modal" id="detailContent"></div>
    </div>

    <!-- ===== MODAL UPLOAD ===== -->
    <div class="modal" id="uploadModal">
        <div class="modal-content upload-modal">
            <span class="modal-close" id="uploadModalClose">&times;</span>
            <h2 class="modal-title">Thêm mã QR mới</h2>
            <form id="uploadForm">
                <!-- ===== TÊN NGƯỜI NHẬN ===== -->
                <div class="form-group">
                    <label>Tên người nhận <span class="required">*</span></label>
                    <input type="text" id="qrName" placeholder="Tên người nhận" />
                    <div class="field-error" id="qrNameError">Vui lòng nhập tên người nhận!</div>
                </div>

                <!-- ===== TÊN NGÂN HÀNG ===== -->
                <div class="form-group">
                    <label>Tên ngân hàng <span class="required">*</span></label>
                    <div class="select-wrapper">
                        <select id="qrBank">
                            <option value="" disabled selected>Chọn ngân hàng...</option>
                            <option value="Techcombank">Techcombank</option>
                            <option value="Vietcombank">Vietcombank</option>
                            <option value="BIDV">BIDV</option>
                            <option value="MB Bank">MB Bank</option>
                            <option value="VPBank">VPBank</option>
                            <option value="TPBANK">TPBANK</option>
                            <option value="MoMo">MoMo</option>
                            <option value="VietinBank">VietinBank</option>
                            <option value="ACB">ACB</option>
                            <option value="Sacombank">Sacombank</option>
                        </select>
                    </div>
                    <div class="field-error" id="qrBankError">Vui lòng chọn tên ngân hàng!</div>
                </div>

                <!-- ===== SỐ TÀI KHOẢN ===== -->
                <div class="form-group">
                    <label>Số tài khoản <span class="optional">(không bắt buộc)</span></label>
                    <input type="text" id="qrAccount" placeholder="Số tài khoản" />
                    <div class="field-error" id="qrAccountError"></div>
                </div>

                <!-- ===== CHỦ TÀI KHOẢN ===== -->
                <div class="form-group">
                    <label>Chủ tài khoản <span class="optional">(không bắt buộc)</span></label>
                    <input type="text" id="qrHolder" placeholder="Tên chủ tài khoản" />
                    <div class="field-error" id="qrHolderError"></div>
                </div>

                <!-- ===== ẢNH MÃ QR ===== -->
                <div class="form-group">
    <label>Ảnh mã QR <span class="required">*</span></label>

    <div class="upload-image-box" id="uploadImageBox">
        <span>Nhấn để chọn ảnh</span>
        <input type="file" id="qrImage" accept="image/*" />
    </div>

    <div class="preview-container" id="previewContainer" style="display:none;">
        <img id="imagePreview" src="" alt="Preview" />
        <button class="btn-remove-image" id="removeImageBtn" type="button">✕</button>
        <span class="preview-label" id="uploadPreviewLabel">📷 Ảnh đã chọn</span>
    </div>

    <div class="crop-wrapper" id="uploadCropContainer" style="display:none;">
        <div class="crop-controls">
            <div class="crop-toolbar">
                <button type="button" class="btn-crop-rotate" id="uploadCropRotateLeft">↺ Xoay trái</button>
                <button type="button" class="btn-crop-rotate" id="uploadCropRotateRight">↻ Xoay phải</button>
                <button type="button" class="btn-crop-reset" id="uploadCropReset">⟲ Đặt lại</button>
            </div>
            <div class="crop-container-inner" id="uploadCropInner">
                <img id="uploadCropImage" src="" alt="Crop" />
            </div>
            <div class="crop-actions">
                <button type="button" class="btn-crop-apply" id="uploadCropApply">Áp dụng cắt</button>
            </div>
        </div>
    </div>

    <div class="field-error" id="qrImageError">
        Vui lòng chọn ảnh mã QR!
    </div>
</div>

                <button type="submit" class="btn-submit">Lưu mã QR</button>
            </form>
        </div>
    </div>

    <!-- ===== MODAL AUTH ===== -->
    <div class="modal" id="authModal">
        <div class="modal-content auth-modal" id="authFormContainer"></div>
    </div>

<!-- ===== FILE INPUT HIDDEN ===== -->
    <input type="file" id="fileInput" accept="image/*" style="display:none;" />
<!-- ===== MODAL CHỈNH SỬA ===== -->
<div class="modal" id="editModal">
    <div class="modal-content edit-modal" id="editContent">
        <!-- Nội dung sẽ được JS tạo -->
    </div>
</div>

    <!-- ===== QR libraries (ZXing + jsQR fallback) ===== -->
    <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="lib/image-optimize.js"></script>
    <script src="lib/qr/read-qr.js"></script>

<script src="js/edit-qr.js"></script>
<script src="validate/validate_searchName.js"></script>
<script src="validate/validate_search_name.js"></script>
<script src="js/script.js"></script>
    <script src="js/pwa.js"></script>
  
    
</body>

</html>
